<!DOCTYPE html>
<html>
<head>

    <title>GuardianAI - Question</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            padding: 40px;
        }

        .box {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .progress {
            color: #64748b;
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 180px;
            padding: 15px;
            font-size: 16px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            box-sizing: border-box;
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

    </style>

</head>

<body>

<div class="box">

    <h1>{{ subject }} Learning</h1>

    <div class="progress">
        Question {{ question_number }} of {{ total_questions }}
    </div>

    <h2>{{ question }}</h2>

    <form action="{{ url_for('learning.submit_answer') }}" method="POST">

        <textarea
            name="answer"
            placeholder="Write your answer here..."
            required></textarea>

        <br>

        <button type="submit">
            Submit Answer
        </button>

    </form>

</div>

</body>
</html>
