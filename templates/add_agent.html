<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Add AI Agent</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card shadow p-4">

<h2>Add AI Agent</h2>

<form method="POST">

<div class="mb-3">

<label class="form-label">
Agent Name
</label>

<input
type="text"
name="name"
class="form-control"
required>

</div>

<div class="mb-3">

<label class="form-label">
Status
</label>

<select
name="status"
class="form-select">

<option>Active</option>

<option>Inactive</option>

</select>

</div>

<div class="mb-3">

<label class="form-label">
Risk Level
</label>

<select
name="risk"
class="form-select">

<option>Low</option>

<option>Medium</option>

<option>High</option>

</select>

</div>

<button
class="btn btn-primary">

Save Agent

</button>

<a
href="/agents"
class="btn btn-secondary">

Back

</a>

</form>

</div>

</div>

</body>

</html>
